[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["docs/**/*", "views/**/*"]
  external_node_modules = ["express", "marked", "gray-matter"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200